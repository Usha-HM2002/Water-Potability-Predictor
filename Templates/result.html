{% extends "base.html" %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:80vh;">

  <div style="background: #ffffff; 
              padding: 30px; 
              border-radius: 20px; 
              box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
              max-width: 600px; 
              width: 100%; 
              text-align: center;
              font-family: 'Segoe UI', sans-serif;">

      <!-- Header Image -->
      <img src="{{ url_for('static', filename='img/Test.png') }}"
           alt="Water"
           style="width:100%; max-height:220px; object-fit:cover; border-radius:15px; margin-bottom:1.5rem;"/>

      <!-- Title -->
      <h1 style="font-size: 1.8rem; color:#1e3c72; margin-bottom: 15px;">
          🔍 Prediction Result
      </h1>

      <!-- Result Badge -->
      {% if result == 'Potable' %}
      <div style="background:#e8f5e9; 
                  color:#2e7d32; 
                  font-size:1.4rem; 
                  font-weight:600; 
                  padding:15px; 
                  border-radius:12px; 
                  margin-bottom:20px;
                  border:2px solid #4caf50;">
          ✅ The water is <span style="color:#1b5e20;">POTABLE</span>
      </div>
      {% else %}
      <div style="background:#ffebee; 
                  color:#c62828; 
                  font-size:1.4rem; 
                  font-weight:600; 
                  padding:15px; 
                  border-radius:12px; 
                  margin-bottom:20px;
                  border:2px solid #f44336;">
          🚫 The water is <span style="color:#b71c1c;">NOT POTABLE</span>
      </div>
      {% endif %}

      <!-- Divider -->
      <hr style="border: none; height: 1px; background: #ddd; margin: 20px 0;">

      <!-- Action Buttons -->
      <div style="display:flex; justify-content:center; flex-wrap:wrap; gap:15px;">
          <a href="{{ url_for('test') }}">
              <button class="action-btn" style="background:#4caf50;">🔁 Test Another Sample</button>
          </a>
          <a href="{{ url_for('home') }}">
              <button class="action-btn" style="background:#2196f3;">🏠 Back to Home</button>
          </a>
        
      </div>
  </div>
</div>

<!-- Styles -->
<style>
  .action-btn {
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 180px;
  }
  .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  }
</style>
{% endblock %}
