{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1>🔐 LOGIN</h1>

        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="success-msg">{{ success }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="post">
            <div class="input-group">
                <input type="text" name="user_input" placeholder="Username or Email" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <p class="register-link">
            Don’t have an account? 
            <a href="{{ url_for('register') }}">Register here</a>
        </p>
    </div>
</div>

<style>
/* Center container */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 75vh;
}

/* Card style */
.login-card {
    background: rgba(0, 0, 0, 0.6);
    padding: 2rem 2.5rem;
    border-radius: 15px;
    width: 350px;
    text-align: center;
    box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
}

/* Heading */
.login-card h1 {
    color: white;
    margin-bottom: 1.5rem;
    font-size: 1.8rem;
}

/* Messages */
.error-msg {
    color: #ff4d4d;
    font-weight: bold;
    margin-bottom: 1rem;
}

.success-msg {
    color: #00cc66;
    font-weight: bold;
    margin-bottom: 1rem;
}

/* Inputs */
.input-group {
    margin-bottom: 1rem;
}

.input-group input {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    outline: none;
    font-size: 1rem;
}

/* Button */
.btn-login {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #0077b6, #00b4d8);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease-in-out;
}

.btn-login:hover {
    background: linear-gradient(135deg, #00b4d8, #0077b6);
}

/* Register link */
.register-link {
    margin-top: 1rem;
    color: #ddd;
    font-size: 0.9rem;
}

.register-link a {
    color: #00c3ff;
    text-decoration: none;
    font-weight: bold;
}

.register-link a:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
